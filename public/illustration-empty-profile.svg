<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="prof-bg" x1="0" y1="0" x2="400" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5f0ff"/>
      <stop offset="100%" stop-color="#ede6ff"/>
    </linearGradient>
    <linearGradient id="prof-bolt" x1="180" y1="50" x2="220" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#aa3bff"/>
      <stop offset="100%" stop-color="#7e14ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="16" fill="url(#prof-bg)"/>
  <!-- Profile card outline -->
  <rect x="120" y="40" width="160" height="180" rx="12" fill="white" opacity="0.6"/>
  <!-- Avatar circle -->
  <circle cx="200" cy="100" r="30" fill="#d4c4ff"/>
  <!-- Person silhouette -->
  <circle cx="200" cy="92" r="12" fill="#b88aff"/>
  <path d="M178 120c0-12.15 9.85-22 22-22s22 9.85 22 22" fill="#b88aff"/>
  <!-- Plus sign (add profile) -->
  <circle cx="230" cy="75" r="10" fill="#863bff" opacity="0.2"/>
  <path d="M230 70v10M225 75h10" fill="none" stroke="#863bff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Text lines placeholder -->
  <rect x="160" y="140" width="80" height="6" rx="3" fill="#d4c4ff"/>
  <rect x="170" y="154" width="60" height="4" rx="2" fill="#e0d0ff"/>
  <rect x="150" y="172" width="100" height="4" rx="2" fill="#e0d0ff"/>
  <rect x="160" y="184" width="80" height="4" rx="2" fill="#e0d0ff"/>
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="4" fill="#aa3bff" opacity="0.2"/>
  <circle cx="350" cy="230" r="5" fill="#aa3bff" opacity="0.2"/>
  <circle cx="60" cy="200" r="3" fill="#aa3bff" opacity="0.15"/>
  <circle cx="340" cy="60" r="3" fill="#aa3bff" opacity="0.15"/>
</svg>
