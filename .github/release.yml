changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: UI and UX
      labels:
        - ui
        - ux
        - design
    - title: Maintenance
      labels:
        - chore
        - maintenance
    - title: Other changes
      labels:
        - "*"
