name: Release browser smoke evidence

on:
  push:
    branches: [preview]
    paths:
      - .github/workflows/browser-smoke-evidence.yml
      - scripts/evidence-target.mjs
      - scripts/playwright-global-setup.mjs
      - scripts/validate-playwright-manifest.mjs
  workflow_dispatch:
    inputs:
      base_url:
        description: Authorized preview or production origin
        required: true
        type: string
      commit_sha:
        description: Exact frontend commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: browser-smoke-evidence-${{ inputs.commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://akaaka-git-preview-aka-aka.vercel.app' }}
      BROWSER_FILTER: chromium-desktop,chromium-mobile,webkit-mobile
      RELEASE_BROWSER_EVIDENCE: 'true'
      EVIDENCE_COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base = new URL(process.env.PLAYWRIGHT_BASE_URL)
          if (base.protocol !== 'https:' || base.username || base.password || base.pathname !== '/' || base.search || base.hash) {
            throw new Error('base_url must be a credential-free HTTPS origin')
          }
          if (!/^[0-9a-f]{40}$/i.test(process.env.EVIDENCE_COMMIT_SHA || '')) {
            throw new Error('commit_sha must be a full 40-character SHA')
          }
          NODE

      - name: Normalize evidence SHA
        shell: bash
        run: echo "EVIDENCE_COMMIT_SHA=$(printf '%s' "$EVIDENCE_COMMIT_SHA" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Checkout exact evidence commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Assert exact evidence commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_COMMIT_SHA"

      - name: Classify target
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_ENV"
          const host = new URL(process.env.PLAYWRIGHT_BASE_URL).hostname
          const production = host === 'akaaka-frontend.vercel.app'
          console.log(`EVIDENCE_TARGET=${production ? 'production' : 'preview'}`)
          console.log(`VERCEL_ENV=${production ? 'production' : 'preview'}`)
          NODE

      - name: Verify deployed commit and branch
        id: target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # A preview push can arrive before its Vercel deployment is ready.
          attempts=1
          if [ "$GITHUB_EVENT_NAME" = push ]; then attempts=30; fi
          for ((i=1; i<=attempts; i++)); do
            if node scripts/evidence-target.mjs; then exit 0; fi
            if [ "$i" -lt "$attempts" ]; then sleep 20; fi
          done
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: browser-evidence-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install evidence browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Fail fast on canonical project inventory
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_FILTER= npx playwright test tests/smoke.spec.ts --list --reporter=json > /tmp/playwright-inventory.json
          node - <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('/tmp/playwright-inventory.json', 'utf8'))
          const names = new Set((report.suites || []).flatMap(function walk(suite) {
            const specs = (suite.specs || []).flatMap(spec => (spec.tests || []).map(test => test.projectName))
            return specs.concat((suite.suites || []).flatMap(walk))
          }).filter(Boolean))
          for (const required of ['chromium-desktop', 'chromium-mobile', 'webkit-mobile']) {
            if (!names.has(required)) throw new Error(`missing canonical evidence project: ${required}`)
          }
          NODE

      - name: Fail fast on anonymous selection
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/smoke.spec.ts --list --reporter=json > /tmp/playwright-selection.json
          node - <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('/tmp/playwright-selection.json', 'utf8'))
          const text = JSON.stringify(report)
          if (/authenticated\.spec|authenticated fixture|storageState/i.test(text)) {
            throw new Error('evidence selection contains authenticated fixture coverage')
          }
          if (!/smoke\.spec\.ts/.test(text)) {
            throw new Error('canonical anonymous smoke file was not selected')
          }
          NODE

      - name: Run anonymous browser evidence
        id: smoke
        run: npx playwright test tests/smoke.spec.ts

      - name: Materialize runtime manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playwright-report
          if [ -f .playwright-runtime-manifest.json ]; then
            cp .playwright-runtime-manifest.json playwright-report/runtime-manifest.json
          fi

      - name: Remove production traces
        if: always() && env.EVIDENCE_TARGET == 'production'
        shell: bash
        run: |
          find test-results playwright-report -type f \( -name 'trace.zip' -o -name '*.zip' \) -delete 2>/dev/null || true

      - name: Validate evidence manifest
        id: manifest
        if: always() && steps.smoke.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          require('child_process').execFileSync('node', ['scripts/validate-playwright-manifest.mjs', 'playwright-report/runtime-manifest.json'], { stdio: 'inherit' })
          const manifest = JSON.parse(fs.readFileSync('playwright-report/runtime-manifest.json', 'utf8'))
          const expectedOrigin = new URL(process.env.PLAYWRIGHT_BASE_URL).origin
          if (manifest.commit !== process.env.EVIDENCE_COMMIT_SHA) throw new Error('runtime manifest commit mismatch')
          if (manifest.baseUrl !== expectedOrigin) throw new Error(`runtime manifest base URL mismatch: ${manifest.baseUrl}`)
          const projects = new Set((manifest.projects || []).map(project => project.project))
          for (const required of ['chromium-desktop', 'chromium-mobile', 'webkit-mobile']) {
            if (!projects.has(required)) throw new Error(`runtime manifest missing project: ${required}`)
          }
          const serialized = JSON.stringify(manifest)
          if (/cookie|access[_-]?token|anon[_-]?key/i.test(serialized)) throw new Error('runtime manifest contains forbidden secret-shaped fields')
          NODE

      - name: Recheck immutable deployment
        id: recheck
        if: always() && steps.smoke.outcome != 'skipped' && steps.target.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node scripts/evidence-target.mjs --recheck
          cp .verified-evidence-target.json playwright-report/deployment.json

      - name: Upload browser evidence
        if: always() && steps.recheck.outcome == 'success' && steps.manifest.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence-${{ inputs.commit_sha || github.sha }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14
