name: Frontend PR CI

on:
  push:
    branches: [ main, preview ]
  pull_request:
    branches: [ main, preview ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  browser-quality:
    name: Playwright browser quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-public-test-key
      BROWSER_FILTER: ${{ github.event_name == 'pull_request' && 'chromium' || (github.ref_name == 'preview' && 'chromium,webkit-mobile' || '') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.event_name == 'pull_request' && 'chromium' || 'all' }}

      - name: Install PR browser
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Install integration browsers
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser smoke matrix
        run: npx playwright test

      - name: Materialize runtime manifest artifact
        if: failure()
        run: |
          mkdir -p playwright-report
          if [ -f .playwright-runtime-manifest.json ]; then
            cp .playwright-runtime-manifest.json playwright-report/runtime-manifest.json
          fi

      - name: Validate runtime manifest
        if: always()
        run: npm run test:manifest

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-quality-report
          path: |
            playwright-report/
            test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7

  lighthouse-quality:
    name: Lighthouse anonymous quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-public-test-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse gate
        run: npm run test:lighthouse

      - name: Upload Lighthouse artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-anonymous-quality-report
          path: lighthouse-report/
          if-no-files-found: ignore
          retention-days: 7
